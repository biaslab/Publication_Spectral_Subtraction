[parameters.hearingaid]
name = "SEM uFB Hearing Aid"
type = "SEMHearingAid"
processing_strategy = "BatchProcessingOffline"

[parameters.frontend]
name = "WFB"
type = "WFBFrontend"
nbands = 17
fs = 16000.0
spl_reference_db = 100.0
spl_power_estimate_lower_bound_db = 30.0
apcoefficient = 0.0
buffer_size_s = 0.0015

[parameters.backend.general]
name = "SEM"
type = "SEMBackend"

[parameters.backend.inference]
autostart = true
free_energy = false
iterations = 1

[parameters.backend.filters.time_constants90]
s = 5.0    # Speech time constant (ms)
n = 700.0  # Noise time constant (ms)
xnr = 20.0 # ξ time constant (ms)

[parameters.backend.priors.speech]
mean = 80.0
precision = 1.0

[parameters.backend.priors.noise]
mean = 80.0
precision = 1.0

[parameters.backend.gain]
threshold_dB  = 0.0  # sigmoid shift θ in σ(ξ - θ); 0 = canonical Wiener centre
threshold_lin = 0.0  # spectral floor in max(gain, threshold_lin); 0 = no floor

[parameters.backend.switch]
threshold = 2.0  # κ = 2 dB: VAD margin

[metadata]
author = "VirtualHearingAid"
date = "2026-04-16"
description = "SEM (uFB) — canonical Wiener gain (θ = 0 dB) with α = 0 (uniform 17-band FIR filter bank). Used for the WFB structural ablation requested by Reviewer 1 / Comment 1.1 / AE.4."
name = "SEM (uFB)"
