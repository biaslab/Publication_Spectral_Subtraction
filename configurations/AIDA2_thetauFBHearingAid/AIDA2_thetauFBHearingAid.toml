[parameters.hearingaid]
name = "AIDA-2 (theta only, uFB)"
type = "SEMHearingAid"
processing_strategy = "BatchProcessingOffline"

[parameters.frontend]
name = "WFB"
type = "WFBFrontend"
nbands = 17
fs = 16000.0
spl_reference_db = 100.0
spl_power_estimate_lower_bound_db = 30.0
apcoefficient = 0.0
buffer_size_s = 0.0015

[parameters.backend.general]
name = "SEM"
type = "SEMBackend"

[parameters.backend.inference]
autostart = true
free_energy = false
iterations = 1

[parameters.backend.filters.time_constants90]
s = 5.0
n = 700.0
xnr = 20.0

[parameters.backend.priors.speech]
mean = 80.0
precision = 1.0

[parameters.backend.priors.noise]
mean = 80.0
precision = 1.0

[parameters.backend.gain]
threshold_dB  = 2.5   # theta = 2.5 dB
threshold_lin = 0.0   # beta = 0

[parameters.backend.switch]
threshold = 2.0

[metadata]
author = "VirtualHearingAid"
date = "2026-04-17"
description = "AIDA-2 theta-only, uFB. Isolates theta at alpha=0 (uniform filter bank)."
name = "AIDA2_thetauFB"
